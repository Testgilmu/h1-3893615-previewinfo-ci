name: build and cache

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          # See here for caching with `yarn`, `bun` or other package managers https://github.com/actions/cache/blob/main/examples.md or you can leverage caching with actions/setup-node https://github.com/actions/setup-node
          path: |
            ~/.npm
            ${{ github.workspace }}/.next/cache
          # Generate a new cache whenever packages or source files change.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-
      - run: npm ci
      - run: npm run build
      - name: preview key file state, no value ever printed
        run: |
          test -f .next/cache/.previewinfo
          echo "previewinfo present in .next/cache"
          echo "previewinfo sha256: $(sha256sum .next/cache/.previewinfo | cut -d' ' -f1)"
          node --input-type=commonjs -e '
            const fs = require("fs");
            try {
              const d = JSON.parse(fs.readFileSync(".next/cache/.previewinfo", "utf8"));
              console.log("expireAt:", new Date(d.expireAt).toISOString());
              console.log("previewModeId length:", String(d.previewModeId).length);
              console.log("field names:", Object.keys(d).join(","));
            } catch (err) {
              console.log("parse failed, error name only:", err.name);
              process.exitCode = 1;
            }
          ' 2>/dev/null
      - name: encrypted build output for the self-hosted deployment
        env:
          ARTIFACT_KEY: ${{ secrets.ARTIFACT_KEY }}
        run: |
          tar --exclude='./cache' -C .next -czf next-dist.tgz .
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in next-dist.tgz -out next-dist.tgz.enc -pass env:ARTIFACT_KEY
          rm -f next-dist.tgz
          echo "encrypted archive sha256: $(sha256sum next-dist.tgz.enc | cut -d' ' -f1)"
          echo "encrypted archive bytes: $(stat -c%s next-dist.tgz.enc)"
      - uses: actions/upload-artifact@v4
        with:
          name: next-dist-encrypted
          retention-days: 7
          path: next-dist.tgz.enc
